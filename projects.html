<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects | Muhammed Midhilaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF0EE; --ink: #16222B; --muted: #55646D; --blue: #1F4E79;
    --line: rgba(22, 34, 43, 0.2);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --text: "Source Serif 4", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #11181D; --ink: #E7ECE8; --muted: #93A2AB; --blue: #86B5DE; --line: rgba(231,236,232,.22); }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .wrap { width: min(1000px, 100% - 2.5rem); margin-inline: auto; }

  .site-header {
    position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .mark { font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; text-decoration: none; }
  nav { display: flex; gap: 1.75rem; font-family: var(--display); font-size: 1rem; font-weight: 600; }
  nav a { text-decoration: none; padding: 0.25rem 0; border-bottom: 2px solid transparent; }
  nav a:hover { border-color: var(--blue); }

  main { padding: clamp(2.5rem, 6vw, 5rem) 0 clamp(3.5rem, 8vw, 6rem); }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.5rem); letter-spacing: -0.03em; margin: 0 0 2.5rem; }

  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list li { border-bottom: 1px solid var(--line); }
  .list a {
    display: flex; align-items: baseline; gap: 1.25rem; text-decoration: none;
    padding: clamp(1.25rem, 3vw, 1.75rem) 0.25rem;
  }
  .list .num { font-family: var(--display); font-weight: 600; color: var(--muted); font-size: 1rem; width: 2ch; flex: none; }
  .list .name { font-family: var(--display); font-weight: 700; font-size: clamp(1.3rem, 4vw, 2rem); letter-spacing: -0.01em; }
  .list a:hover .name { color: var(--blue); }
  .list .soon { margin-left: auto; font-family: var(--display); font-size: 0.9rem; color: var(--muted); }

  footer { padding: 1.5rem 0 calc(2rem + env(safe-area-inset-bottom, 0px)); font-family: var(--display); font-size: 0.95rem; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="mark" href="index.html">Muhammed Midhilaj</a>
    <nav aria-label="Main">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Projects</h1>
    <!--
      Each project below is a placeholder. To publish one:
      1. Create its page (e.g. basant-panchami.html) and put its photos in a folder.
      2. Replace href="#" with that page's file name.
      3. Optionally remove the "Coming soon" label.
    -->
    <ul class="list">
      <li><a href="#"><span class="num">01</span><span class="name">Basant Panchami</span><span class="soon">Coming soon</span></a></li>
      <li><a href="#"><span class="num">02</span><span class="name">Muharram</span><span class="soon">Coming soon</span></a></li>
      <li><a href="#"><span class="num">03</span><span class="name">Protests</span><span class="soon">Coming soon</span></a></li>
      <li><a href="jama-masjid.html"><span class="num">04</span><span class="name">Jama Masjid</span></a></li>
      <li><a href="sarkhej.html"><span class="num">05</span><span class="name">Sarkhej</span></a></li>
      <li><a href="fish-harbour.html"><span class="num">06</span><span class="name">Fish Harbour</span></a></li>
    </ul>
  </div>
</main>

<footer>
  <div class="wrap">&copy; <span id="year"></span> Muhammed Midhilaj</div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
